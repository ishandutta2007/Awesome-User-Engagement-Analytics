<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.3" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .wave-flow {
        animation: waveMove 12s linear infinite;
      }
      .node-glow {
        animation: nodePulse 3s ease-in-out infinite alternate;
      }
      .bar-bounce {
        animation: barGrow 2.5s ease-in-out infinite alternate;
        transform-origin: bottom;
      }
      .radar-sweep {
        transform-origin: 1050px 180px;
        animation: rotateSweep 8s linear infinite;
      }
      @keyframes pulse {
        0% { transform: scale(0.96); opacity: 0.3; }
        100% { transform: scale(1.04); opacity: 0.65; }
      }
      @keyframes waveMove {
        0% { transform: translateX(0); }
        100% { transform: translateX(-400px); }
      }
      @keyframes nodePulse {
        0% { r: 4px; opacity: 0.5; }
        100% { r: 7px; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
      }
      @keyframes barGrow {
        0% { transform: scaleY(0.7); }
        100% { transform: scaleY(1.15); }
      }
      @keyframes rotateSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- Dynamic / Animated Background Layer: Ambient Glow Orbs -->
  <g class="pulse-circle" style="transform-origin: 200px 100px;">
    <circle cx="200" cy="100" r="160" fill="#38bdf8" opacity="0.12" filter="url(#soft-glow)" />
  </g>
  <g class="pulse-circle" style="transform-origin: 1000px 240px; animation-delay: 2s;">
    <circle cx="1000" cy="240" r="180" fill="#a855f7" opacity="0.14" filter="url(#soft-glow)" />
  </g>

  <!-- Dynamic / Animated Background Wave Chart Flow -->
  <g opacity="0.35">
    <path class="wave-flow" d="M -400,280 Q -300,220 -200,260 T 0,270 T 200,240 T 400,290 T 600,230 T 800,270 T 1000,220 T 1200,260 T 1400,230 T 1600,280" fill="none" stroke="url(#accent-grad)" stroke-width="2.5" />
    <path class="wave-flow" style="animation-duration: 8s; animation-direction: reverse;" d="M -400,295 Q -300,250 -200,280 T 0,260 T 200,300 T 400,250 T 600,285 T 800,240 T 1000,290 T 1200,250 T 1400,280 T 1600,295" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />
  </g>

  <!-- Background Data Graphics: Analytics Radar & Live Metrics Simulation (Right Side) -->
  <g opacity="0.6" transform="translate(150, 0)">
    <!-- Radar Grid Circles -->
    <circle cx="900" cy="180" r="110" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" />
    <circle cx="900" cy="180" r="75" fill="none" stroke="#334155" stroke-width="1" />
    <circle cx="900" cy="180" r="40" fill="none" stroke="#475569" stroke-width="1" />
    <line x1="780" y1="180" x2="1020" y2="180" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="900" y1="60" x2="900" y2="300" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
    
    <!-- Radar Sweep Effect -->
    <path class="radar-sweep" d="M 900,180 L 1000,130 A 110 110 0 0 0 900,70 Z" fill="url(#glow-grad)" opacity="0.5" />

    <!-- Pulsing Metric Data Points -->
    <circle class="node-glow" cx="950" cy="140" r="5" fill="#38bdf8" />
    <circle class="node-glow" style="animation-delay: 1s;" cx="860" cy="220" r="4" fill="#a855f7" />
    <circle class="node-glow" style="animation-delay: 2s;" cx="920" cy="235" r="5" fill="#34d399" />
    <circle class="node-glow" style="animation-delay: 0.5s;" cx="850" cy="130" r="4" fill="#f43f5e" />

    <!-- Interactive Funnel / Bar Visualization -->
    <g transform="translate(740, 240)">
      <rect class="bar-bounce" x="0" y="-50" width="8" height="50" rx="3" fill="#38bdf8" opacity="0.75" />
      <rect class="bar-bounce" style="animation-delay: 0.3s;" x="14" y="-75" width="8" height="75" rx="3" fill="#818cf8" opacity="0.85" />
      <rect class="bar-bounce" style="animation-delay: 0.6s;" x="28" y="-95" width="8" height="95" rx="3" fill="#a855f7" opacity="0.9" />
      <rect class="bar-bounce" style="animation-delay: 0.9s;" x="42" y="-60" width="8" height="60" rx="3" fill="#c084fc" opacity="0.8" />
    </g>
  </g>

  <!-- FOREGROUND LAYER: Content stays clear, fully legible, and never obscured -->
  
  <!-- Pill Tag: Ecosystem Focus -->
  <g transform="translate(60, 48)">
    <rect width="320" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1" />
    <circle cx="18" cy="16" r="6" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.5">
      PRODUCT ANALYTICS &amp; ENGAGEMENT
    </text>
  </g>

  <!-- Main Title -->
  <text x="60" y="145" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.8))">
    Awesome User Engagement
  </text>
  <text x="60" y="198" fill="url(#accent-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="drop-shadow(0 2px 10px rgba(0,0,0,0.9))">
    Analytics Ecosystem
  </text>

  <!-- Subtitle -->
  <text x="60" y="242" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500">
    Curated SaaS &amp; Open-Source Platforms for Event Tracking, Funnels &amp; Session Replay
  </text>

  <!-- Feature Tags / Capabilities Badges (Foreground) -->
  <g transform="translate(60, 275)">
    <!-- Badge 1: Product Analytics -->
    <g transform="translate(0, 0)">
      <rect width="165" height="32" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" />
      <text x="14" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📊 Product Analytics</text>
    </g>

    <!-- Badge 2: Session Replay -->
    <g transform="translate(177, 0)">
      <rect width="150" height="32" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#818cf8" stroke-width="1" />
      <text x="14" y="20" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🎥 Session Replay</text>
    </g>

    <!-- Badge 3: Behavioral Cohorts -->
    <g transform="translate(339, 0)">
      <rect width="175" height="32" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#c084fc" stroke-width="1" />
      <text x="14" y="20" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">👥 Behavioral Cohorts</text>
    </g>

    <!-- Badge 4: Self-Hosted &amp; Privacy -->
    <g transform="translate(526, 0)">
      <rect width="180" height="32" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#34d399" stroke-width="1" />
      <text x="14" y="20" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ Self-Hosted &amp; GDPR</text>
    </g>
  </g>
</svg>
